<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100問チャレンジゲーム</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* 画面の切り替え用クラス */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .choice-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background-color: #6c757d;
        }
        .choice-btn:hover {
            background-color: #5a6268;
        }
        #score-area {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>


    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <h1>100問チャレンジ！</h1>
            <p>全100問のクイズに挑戦しよう！</p>
            <button id="start-btn">ゲームスタート</button>
        </div>


        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <p id="question-count">第 1 問 / 100問</p>
            <h2 id="question-text">ここに問題文が表示されます</h2>
            <div id="choices-container">
                <!-- 選択肢が自動でここに入ります -->
            </div>
        </div>


        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <h1>結果発表</h1>
            <p id="score-area">正解数：0 / 100</p>
            <button id="restart-btn">もう一度プレイする</button>
        </div>
    </div>


    <script>
        // --- 1. 全100問のデータ作成（自動生成または自由に書き換え可能） ---
        const quizData = [];
        for (let i = 1; i <= 100; i++) {
            quizData.push({
                question: `問題 ${i}：${i} ＋ ${i} はいくつ？`,
                choices: [String(i * 2), String(i * 2 + 2), String(i * 2 - 2), String(i)],
                answer: String(i * 2)
            });
        }


        let currentIdx = 0;
        let score = 0;


        // --- 2. 要素の取得 ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const questionCountElem = document.getElementById('question-count');
        const questionTextElem = document.getElementById('question-text');
        const choicesContainer = document.getElementById('choices-container');
        const scoreArea = document.getElementById('score-area');


        // --- 3. 画面切り替えの仕組み ---
        function showScreen(screenElement) {
            // すべての画面を非表示にする
            startScreen.classList.remove('active');
            gameScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            
            // 指定した画面だけを表示する
            screenElement.classList.add('active');
        }


        // --- 4. ゲームスタートボタンを押したときの処理 ---
        startBtn.addEventListener('click', () => {
            currentIdx = 0;
            score = 0;
            showScreen(gameScreen); // ゲーム画面へ切り替え
            loadQuestion();         // 最初の問題を表示
        });


        // --- 5. 問題を読み込んで画面に反映する処理 ---
        function loadQuestion() {
            if (currentIdx >= quizData.length) {
                // 100問終わったら結果画面へ
                scoreArea.textContent = `正解数：${score} / 100`;
                showScreen(resultScreen);
                return;
            }


            const currentQuiz = quizData[currentIdx];
            questionCountElem.textContent = `第 ${currentIdx + 1} 問 / 100問`;
            questionTextElem.textContent = currentQuiz.question;


            // 選択肢ボタンをクリアして再作成
            choicesContainer.innerHTML = '';
            currentQuiz.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice;
                btn.className = 'choice-btn';
                btn.addEventListener('click', () => checkAnswer(choice, currentQuiz.answer));
                choicesContainer.appendChild(btn);
            });
        }


        // --- 6. 答え合わせの処理 ---
        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score++;
            }
            currentIdx++;
            loadQuestion(); // 次の問題へ進む
        }


        // --- 7. もう一度プレイボタンの処理 ---
        restartBtn.addEventListener('click', () => {
            showScreen(startScreen);
        });
    </script>
</body>
</html>
