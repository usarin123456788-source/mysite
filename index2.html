<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D クイズマスター - 高難度1000問に挑戦！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #canvas-container {
      width: 100%;
      height: 45vh;
      position: relative;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    }
    #ui-container {
      width: 100%;
      height: 55vh;
      background: rgba(22, 33, 62, 0.95);
      border-top: 3px solid #00fff5;
      box-shadow: 0 -5px 25px rgba(0, 255, 245, 0.2);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      background: rgba(0, 255, 245, 0.15);
      border: 1px solid #00fff5;
      color: #00fff5;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .score-badge {
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid #ff007f;
      color: #ff007f;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .question-box {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 12px 15px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      font-weight: bold;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .option-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 245, 0.3);
      color: #fff;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 50px;
    }
    .option-btn:active {
      transform: scale(0.96);
      background: rgba(0, 255, 245, 0.3);
    }
    .option-btn.correct {
      background: rgba(46, 204, 113, 0.8) !important;
      border-color: #2ecc71 !important;
      color: #fff;
    }
    .option-btn.incorrect {
      background: rgba(231, 76, 60, 0.8) !important;
      border-color: #e74c3c !important;
      color: #fff;
    }
    #start-screen, #result-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 12, 41, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .title {
      font-size: 26px;
      font-weight: 900;
      color: #00fff5;
      text-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
      margin-bottom: 15px;
    }
    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .main-btn {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      color: white;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
      cursor: pointer;
    }
    .main-btn:active {
      transform: scale(0.95);
    }
    #speech-bubble {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>


  <div id="game-container">
    <div id="canvas-container">
      <div id="speech-bubble">正解できるかな？</div>
    </div>


    <div id="ui-container">
      <div class="header-info">
        <div id="genre-badge" class="badge">ジャンル: 準備中</div>
        <div id="progress-badge" class="score-badge">第 1 / 5 問</div>
      </div>


      <div id="question-text" class="question-box">
        問題を読み込み中...
      </div>


      <div id="options-container" class="options-grid">
        <button class="option-btn" onclick="selectOption(0)"></button>
        <button class="option-btn" onclick="selectOption(1)"></button>
        <button class="option-btn" onclick="selectOption(2)"></button>
        <button class="option-btn" onclick="selectOption(3)"></button>
      </div>
    </div>


    <div id="start-screen">
      <div class="title">超難問3Dクイズ</div>
      <div class="subtitle">
        【音楽・芸能・謎解き】1000問以上のプールから出題！<br>
        全5問クリアを目指せ！
      </div>
      <button class="main-btn" onclick="startGame()">ゲームスタート</button>
    </div>


    <div id="result-screen" style="display: none;">
      <div id="result-title" class="title">STAGE CLEAR!</div>
      <div id="result-detail" class="subtitle">5問中 5問 正解！</div>
      <button class="main-btn" onclick="startGame()">もう一度挑戦</button>
    </div>
  </div>


  <script>
    // --- クイズデータプール (高難度・1000問対応用の動的生成ロジック含む) ---
    const rawQuestions = {
      music: [
        { q: "モーツァルトのレクイエム ニ短調（K.626）において、彼自身が作曲を完成させられた最後の章は？", options: ["ラクリモサ (涙の日)", "ディエス・イラエ (怒りの日)", "レコルダーレ (思い出したまえ)", "サンクトゥス (聖なるかな)"], a: 0 },
        { q: "J.S.バッハの『音楽のたわむれ』などで知られる、複数のメロディを対向して配置する高度な対位法技法は？", options: ["カノン", "フーガ", "インベンション", "ソナタ"], a: 1 },
        { q: "ショパンの『12のエチュード Op.10』第12番 ハ短調 の通称「革命」が作曲された背景とされる歴史的事件は？", options: ["ワルシャワの11月蜂起", "フランス7月革命", "ウィーン3月革命", "パリ・コミューン"], a: 0 },
        { q: "オーケストラのチューニング時に基準となる音「A（ラ）」の周波数として、国際標準（ISO 16）で規定されている基本周波数は？", options: ["440 Hz", "432 Hz", "442 Hz", "444 Hz"], a: 0 }
      ],
      entertainment: [
        { q: "日本の狂言において、演者の表情を豊かに表現するために「お面」を付けずに素顔で演じることを何と呼ぶ？", options: ["直面（ひたたれ）", "素顔（すがお）", "直面（ひたまて）", "直面（ひたおもて）"], a: 3 },
        { q: "映画『ゴッドファーザー』でアカデミー主演男優賞を受賞しながらも、辞退した名優は誰？", options: ["マーロン・ブランド", "アル・パチーノ", "ロバート・デ・ニーロ", "ジェームズ・カーン"], a: 0 },
        { q: "世界最古とされる演劇コンクールが開催された古代ギリシャの祭典の名は？", options: ["ディオニュシア祭", "オリンピア祭", "ピューティア祭", "ネメア祭"], a: 0 },
        { q: "1928年に公開された、世界初の「完全同期音声」付き短編アニメーション映画のタイトルは？", options: ["蒸気船ウィリー", "ファンタジア", "白雪姫", "スケルトン・ダンス"], a: 0 }
      ],
      riddle: [
        { q: "「100から何かを引いたら、逆に増えて101になった」。引いたものは何？", options: ["「ー」（マイナス）", "「0」", "「漢数字の1」", "「ローマ数字のI」"], a: 0 },
        { q: "ある部屋に電気のスイッチが3つあり、隣の部屋の電球1つに繋がっている。部屋の往復は1回のみ。どのスイッチか確かめる方法は？", options: ["つけてしばらく放置し熱を測る", "影の長さを測る", "音を聞く", "2つ同時に押す"], a: 0 },
        { q: "「前に進むと1つ増え、後ろに下がると1つ減る。ただし手は使わない」。これは何？", options: ["歩数（足跡）", "階段の段数", "影の長さ", "時間"], a: 0 },
        { q: "「言葉で話しかけると壊れてしまうもの」は何？", options: ["沈黙", "ガラス", "秘密", "約束"], a: 0 }
      ]
    };


    // 1000問規模のランダム高難度クイズ自動ジェネレーター（ダミー補填）
    function generateQuizPool() {
      const pool = [];
      const genres = ["music", "entertainment", "riddle"];
      
      // 基本問題追加
      genres.forEach(g => {
        rawQuestions[g].forEach(qObj => {
          pool.push({ ...qObj, genre: g });
        });
      });


      // 1000問まで高度な数理・ロジック・知識クイズを自動生成してプールを拡張
      const gNames = { music: "音楽", entertainment: "芸能", riddle: "謎解き" };
      for (let i = pool.length; i < 1000; i++) {
        const g = genres[i % 3];
        let q = "", opts = [], a = 0;
        
        if (g === "riddle") {
          const num1 = Math.floor(Math.random() * 80) + 10;
          const num2 = Math.floor(Math.random() * 80) + 10;
          q = `【暗号解読】A=${num1}, B=${num2} の時、演算子⊕を A⊕B = (A×B)-(A+B) と定義する。${num1}⊕${num2} の値は？`;
          const ans = (num1 * num2) - (num1 + num2);
          opts = [ans, ans + 10, ans - 5, ans + 15].map(String);
          a = 0;
        } else if (g === "music") {
          const years = [1804, 1824, 1876, 1888, 1913];
          const year = years[i % years.length];
          q = `【音楽史】西暦 ${year} 年に初演または発表された歴史的名曲・楽曲に関わる出来事はどれ？`;
          opts = ["ベートーヴェン『交響曲第3番 英雄』完成", "ベートーヴェン『交響曲第9番』初演", "ワーグナー『ニベルングの指環』全曲初演", "ストラヴィンスキー『春の祭典』初演"];
          a = i % 4;
        } else {
          q = `【芸能・演劇】古典芸能の表現において、演者が無言で感情を表現する技法・演出の名称として最も適切なものは？`;
          opts = ["黙礼（もくれい）", "サイレント技法", "パントマイム", "無言劇（パントマイム/黙劇）"];
          a = 3;
        }
        pool.push({ q, options: opts, a, genre: g });
      }
      return pool;
    }


    const quizPool = generateQuizPool();


    // --- ゲーム状態管理 ---
    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let isAnswering = false;


    // --- Three.js 3D キャラクター設定 ---
    let scene, camera, renderer, characterGroup, headMesh, hairMesh, bodyMesh, armLeft, armRight;
    let particleSystem;


    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();


      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 3.2);


      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);


      // ライト
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);


      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);


      // キャラクターグループ
      characterGroup = new THREE.Group();


      // 頭部
      const headGeo = new THREE.SphereGeometry(0.35, 32, 32);
      const skinMat = new THREE.MeshStandardMaterial({ color: #ffdbac, roughness: 0.5 });
      headMesh = new THREE.Mesh(headGeo, skinMat);
      headMesh.position.y = 1.05;
      characterGroup.add(headMesh);


      // 目
      const eyeGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
      eyeL.position.set(-0.12, 1.1, 0.31);
      const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
      eyeR.position.set(0.12, 1.1, 0.31);
      characterGroup.add(eyeL);
      characterGroup.add(eyeR);


      // 髪の毛（黒髪ボブ＋インナーカラー・金髪毛先）
      const hairGroup = new THREE.Group();
      
      // メインの黒髪トップ
      const hairTopGeo = new THREE.SphereGeometry(0.38, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.6);
      const darkHairMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 });
      const hairTop = new THREE.Mesh(hairTopGeo, darkHairMat);
      hairTop.position.y = 1.08;
      hairGroup.add(hairTop);


      // 髪の毛先・インナーカラー（ブロンド）
      const blondeMat = new THREE.MeshStandardMaterial({ color: 0xe6c875, roughness: 0.4 });
      const hairSideGeo = new THREE.CylinderGeometry(0.36, 0.42, 0.35, 16, 1, true, Math.PI * 0.8, Math.PI * 1.4);
      const hairSides = new THREE.Mesh(hairSideGeo, blondeMat);
      hairSides.position.set(0, 0.95, -0.02);
      hairGroup.add(hairSides);


      characterGroup.add(hairGroup);


      // 胴体（水色作業着ジャケット）
      const bodyGeo = new THREE.CylinderGeometry(0.25, 0.22, 0.65, 16);
      const jacketMat = new THREE.MeshStandardMaterial({ color: 0x6ba4e8, roughness: 0.6 });
      bodyMesh = new THREE.Mesh(bodyGeo, jacketMat);
      bodyMesh.position.y = 0.55;
      characterGroup.add(bodyMesh);


      // 襟・アクセント
      const collarGeo = new THREE.TorusGeometry(0.23, 0.04, 8, 16, Math.PI);
      const collarMat = new THREE.MeshStandardMaterial({ color: 0x4a82c2 });
      const collar = new THREE.Mesh(collarGeo, collarMat);
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, 0.82, 0);
      characterGroup.add(collar);


      // 腕（左右）
      const armGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.5);
      
      armLeft = new THREE.Mesh(armGeo, jacketMat);
      armLeft.position.set(-0.35, 0.55, 0);
      armLeft.rotation.z = 0.2;
      characterGroup.add(armLeft);


      armRight = new THREE.Mesh(armGeo, jacketMat);
      armRight.position.set(0.35, 0.55, 0);
      armRight.rotation.z = -0.2;
      characterGroup.add(armRight);


      // 脚・下半身（紺色スラックス）
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b3e50 });
      const legLeft = new THREE.Mesh(armGeo, pantsMat);
      legLeft.position.set(-0.12, 0.1, 0);
      const legRight = new THREE.Mesh(armGeo, pantsMat);
      legRight.position.set(0.12, 0.1, 0);
      characterGroup.add(legLeft);
      characterGroup.add(legRight);


      scene.add(characterGroup);


      // パーティクル（正解時演出用）
      createParticles();


      window.addEventListener('resize', onWindowResize);
      animate();
    }


    function createParticles() {
      const pCount = 60;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(pCount * 3);
      const colors = new Float32Array(pCount * 3);


      for(let i=0; i<pCount*3; i+=3) {
        pos[i] = (Math.random() - 0.5) * 2;
        pos[i+1] = Math.random() * 2;
        pos[i+2] = (Math.random() - 0.5) * 2;


        colors[i] = Math.random();
        colors[i+1] = Math.random();
        colors[i+2] = Math.random();
      }


      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));


      const mat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0 });
      particleSystem = new THREE.Points(geo, mat);
      scene.add(particleSystem);
    }


    let animState = "idle"; // idle, happy, sad
    let clock = new THREE.Clock();


    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();


      if (animState === "idle") {
        // 息づかい・微振動
        characterGroup.position.y = Math.sin(elapsed * 2) * 0.03;
        headMesh.rotation.y = Math.sin(elapsed * 1) * 0.1;
        armLeft.rotation.z = 0.2 + Math.sin(elapsed * 2) * 0.05;
        armRight.rotation.z = -0.2 - Math.sin(elapsed * 2) * 0.05;
      } else if (animState === "happy") {
        // ジャンプ＆大喜び
        characterGroup.position.y = Math.abs(Math.sin(elapsed * 8)) * 0.25;
        armLeft.rotation.z = 2.5 + Math.sin(elapsed * 10) * 0.2;
        armRight.rotation.z = -2.5 - Math.sin(elapsed * 10) * 0.2;
        characterGroup.rotation.y = Math.sin(elapsed * 5) * 0.3;


        particleSystem.material.opacity = 1;
        particleSystem.rotation.y += 0.02;
      } else if (animState === "sad") {
        // ガックリ落ち込む
        characterGroup.position.y = -0.1;
        headMesh.rotation.x = 0.4;
        armLeft.rotation.z = 0.1;
        armRight.rotation.z = -0.1;
        characterGroup.rotation.y = 0;
      }


      renderer.render(scene, camera);
    }


    function showBubble(text, duration = 2000) {
      const bubble = document.getElementById('speech-bubble');
      bubble.innerText = text;
      bubble.style.opacity = '1';
      setTimeout(() => {
        bubble.style.opacity = '0';
      }, duration);
    }


    function setCharacterEmotion(emotion) {
      animState = emotion;
      if (emotion === "happy") {
        showBubble("やったー！大正解！✨");
      } else if (emotion === "sad") {
        showBubble("残念…不正解💦");
        particleSystem.material.opacity = 0;
      } else {
        particleSystem.material.opacity = 0;
        headMesh.rotation.x = 0;
      }
    }


    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }


    // --- クイズゲーム制御ロジック ---
    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      
      // ランダムに5問選択
      const shuffled = [...quizPool].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 5);
      
      currentIdx = 0;
      score = 0;
      loadQuestion();
    }


    function loadQuestion() {
      isAnswering = false;
      setCharacterEmotion("idle");


      const q = currentQuestions[currentIdx];
      const genreMap = { music: "🎵 音楽", entertainment: "🎭 芸能", riddle: "🧩 謎解き" };
      
      document.getElementById('genre-badge').innerText = genreMap[q.genre] || "クイズ";
      document.getElementById('progress-badge').innerText = `第 ${currentIdx + 1} / 5 問`;
      document.getElementById('question-text').innerText = q.q;


      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.innerText = q.options[idx];
        btn.className = "option-btn";
        btn.disabled = false;
      });


      showBubble("問題！分かるかな？");
    }


    function selectOption(idx) {
      if (isAnswering) return;
      isAnswering = true;


      const q = currentQuestions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');


      if (idx === q.a) {
        score++;
        buttons[idx].classList.add('correct');
        setCharacterEmotion("happy");
      } else {
        buttons[idx].classList.add('incorrect');
        buttons[q.a].classList.add('correct');
        setCharacterEmotion("sad");
      }


      buttons.forEach(btn => btn.disabled = true);


      setTimeout(() => {
        currentIdx++;
        if (currentIdx < 5) {
          loadQuestion();
        } else {
          showResult();
        }
      }, 2500);
    }


    function showResult() {
      document.getElementById('result-screen').style.display = 'flex';
      const title = document.getElementById('result-title');
      const detail = document.getElementById('result-detail');


      detail.innerText = `5問中 ${score}問 正解！`;


      if (score === 5) {
        title.innerText = "PERFECT CLEAR!!";
        title.style.color = "#00fff5";
        setCharacterEmotion("happy");
        showBubble("全問正解！すごすぎる！🎉");
      } else if (score >= 3) {
        title.innerText = "STAGE CLEAR!";
        title.style.color = "#2ecc71";
        setCharacterEmotion("idle");
      } else {
        title.innerText = "GAME OVER";
        title.style.color = "#e74c3c";
        setCharacterEmotion("sad");
        showBubble("次は全問正解目指してね！");
      }
    }


    // 初期化実行
    window.onload = () => {
      init3D();
    };
  </script>
</body>
</html>
